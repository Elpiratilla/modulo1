<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piratilla Clothing</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="logo.png" alt="Logo Piratilla">
                <h2>Piratilla Clothing</h2>
            </div>
            <button class="menu-btn" id="menu-btn">
                ☰
            </button>
            <ul class="menu" id="menu">
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Productos</a></li>
                <li><a href="#">Ofertas</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
            <div class="carrito">
                🛒 <span id="contador">0</span>
            </div>
        </nav>
    </header>
    <section class="slider">
        <div class="slides">
            <img src="sueter.png" class="slide activo" alt="Suéter">
            <img src="pantalones.png" class="slide" alt="Pantalones">
            <img src="camisas.jpg" class="slide" alt="Camisas">
            <img src="suter_2.jpg" class="slide" alt="Suéter 2">
            <img src="camisacorb.jpg" class="slide" alt="Camisa">
            <img src="suetercafe.jpg" class="slide" alt="Suéter Café">
        </div>
        <button class="anterior" onclick="anterior()">❮</button>
        <button class="siguiente" onclick="siguiente()">❯</button>
    </section>
    <main>
        <h1>Nuestro Catálogo</h1>
        <section class="productos">
            <div class="producto">
                <img src="sueter.png" alt="">
                <h3>Suéter Negro</h3>
                <p>$25.00</p>
                <button onclick="agregarCarrito()">Agregar al carrito</button>
            </div>
            <div class="producto">
                <img src="camisas.jpg" alt="">
                <h3>Camisa Blanca</h3>
                <p>$20.00</p>
                <button onclick="agregarCarrito()">Agregar al carrito</button>
            </div>
            <div class="producto">
                <img src="pantalones.png" alt="">
                <h3>Pantalón Cargo</h3>
                <p>$30.00</p>
                <button onclick="agregarCarrito()">Agregar al carrito</button>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Piratilla Clothing</p>
    </footer>
    <script src="funcion.js"></script>
</body>
</html>
