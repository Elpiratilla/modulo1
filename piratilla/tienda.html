<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIENDA DE Piratilla</title>
    <link rel="stylesheet" href="estilocarrusel.css">
    <link rel="stylesheet" href="carrusel.css">
</head>
<body>

    <header>
        <div class="grid-container">
            <div class="header">
                <h2>Piratilla CLOTHING</h2>
                <img src="" alt="Logo" width="200px">
                <div class="cart-icon">
                    🛒 <span id="cart-count">0</span>
                </div>
            </div>
        </div>
    </header>

    <main>
        <h1>CARRUSEL DE CLOTHES</h1>

        <section class="slider">

            <div class="slider-nav">
                <a href="#Imagen1">1</a>
                <a href="#Imagen2">2</a>
                <a href="#Imagen3">3</a>
                <a href="#Imagen4">4</a>
                <a href="#Imagen5">5</a>
                <a href="#Imagen6">6</a>
            </div>


            <div class="slides-todo">
                <div class="slides">
                    <div id="Imagen1" class="slide-1">
                        <img src="sueter.png" alt="Imagen 1" width="350">
                    </div>
                    <div id="Imagen2" class="slide-2">
                        <img src="pantalones.png" alt="Imagen 2" width="350" height="600">
                    </div>
                    <div id="Imagen3" class="slide-3">
                        <img src="camisas.jpg" alt="Imagen 3" width="350" height="600">
                    </div>
                    <div id="Imagen4" class="slide-4">
                        <img src="suter_2.jpg" alt="Imagen 4" width="350" height="600">
                    </div>
                    <div id="Imagen5" class="slide-5">
                        <img src="camisacorb.jpg" alt="Imagen 5" width="350">
                    </div>
                    <div id="Imagen6" class="slide-6">
                        <img src="suetercafe.jpg" alt="Imagen 6" width="350" height="600">
                    </div>
                </div>
            </div>
        </section>

        <button class="view-btn" onclick="mirar()">Ver catalogo</button>
    </main>

    <script src="funciones.js"></script>
    <script src="ver.js"></script>
</body>
</html>
